<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenFocus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../../icons/icon48.png" alt="" />
      <span class="brand">OpenFocus</span>
    </header>
    <section class="hero">
      <div class="orb" aria-hidden="true"></div>
      <div>
        <p class="saved" id="saved"></p>
        <p class="saved-sub" id="saved-sub"></p>
      </div>
    </section>
    <div class="status" id="status"></div>
    <div class="site" id="site" hidden></div>
    <div class="breaks" id="breaks"></div>
    <button class="open" id="open-dashboard" type="button">Open dashboard</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
